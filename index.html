<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rental Property Tracker — Landlord Rent, Expense &amp; Lease Manager</title>
<meta name="theme-color" content="#1F2B3D">
<style>
:root{--navy:#1F2B3D;--navy2:#2C3B52;--terra:#C9694B;--terra2:#E8A48A;--sage:#6F927C;--sand:#F4EDE3;--sand2:#EADFCF;--cream:#FBF8F3;
--bg:#F6F2EC;--paper:#FFFFFF;--tx:#1B2433;--tx2:#5F6878;--line:#E7DFD3;--ok:#3F8A64;--okbg:#E2F1E8;--bad:#C24B4B;--badbg:#FBE6E3;--warn:#A86A1E;--warnbg:#FBEFD9;--info:#3E6E9C;--infobg:#E3EDF7;
--sh:0 1px 2px rgba(31,43,61,.06),0 10px 26px rgba(31,43,61,.08);--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--sans:Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
html[data-theme=dark]{--bg:#121823;--paper:#1B2331;--tx:#EEF1F5;--tx2:#A8B1C0;--line:#2B3546;--sand:#252F40;--sand2:#2E3A4E;--cream:#182030;--okbg:#1C3A2C;--ok:#8ED3AE;--badbg:#45232A;--bad:#F2A0A0;--warnbg:#41331C;--warn:#EDC07E;--infobg:#1E3147;--info:#9CC4EA;--sh:0 1px 2px rgba(0,0,0,.3),0 10px 26px rgba(0,0,0,.3)}
*{box-sizing:border-box}html,body{margin:0}body{font-family:var(--sans);background:var(--bg);color:var(--tx);font-size:14px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
input,select,textarea{border:1.5px solid var(--line);background:var(--paper);border-radius:11px;padding:9px 11px;outline:none;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--terra)}textarea{min-height:70px;resize:vertical}
svg{display:block}
.app{display:flex;min-height:100vh}
#side{width:236px;flex:0 0 236px;background:var(--navy);color:#E9EDF3;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
html[data-theme=dark] #side{background:#0D121B}
.brand{display:flex;gap:11px;align-items:center;padding:18px 16px 16px}.brand img{width:44px;height:44px;border-radius:12px}
.brand b{display:block;font-family:var(--serif);font-size:19px;color:#fff;line-height:1.05}.brand span{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--terra2)}
#nav{flex:1;overflow-y:auto;padding:4px 10px 14px}
.nv{display:flex;gap:11px;align-items:center;width:100%;border:0;background:none;color:#DCE2EB;text-align:left;padding:10px 10px;border-radius:12px;margin:2px 0;font-size:14px;font-weight:600}
.nv:hover{background:rgba(255,255,255,.07)}.nv.on{background:var(--terra);color:#fff}
.nv .ic{width:30px;height:30px;flex:0 0 30px;border-radius:9px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center}.nv.on .ic{background:rgba(255,255,255,.22)}
.nv .ic svg{width:17px;height:17px}.nv .cnt{margin-left:auto;background:var(--bad);color:#fff;font-size:10.5px;border-radius:999px;padding:2px 7px}
.nv.on .cnt{background:#fff;color:var(--bad)}
.sidefoot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.1);font-size:11.5px;color:#AEB8C7}
#main{flex:1;min-width:0;padding:0 26px 40px}.wrap{max-width:1240px;margin:0 auto}
header.top{display:flex;align-items:center;gap:10px;padding:16px 0;position:sticky;top:0;background:var(--bg);z-index:30}
.ib.ham{display:none}.ttl{flex:1 1 auto;min-width:150px}.ttl h1{font-family:var(--serif);font-weight:600;font-size:25px;margin:0;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ttl p{margin:0;color:var(--tx2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[data-theme=dark] .ttl h1{color:#fff}
.chip{display:flex;align-items:center;gap:7px;border:1.5px dashed var(--terra2);background:var(--sand);border-radius:999px;padding:4px 5px 4px 12px;font-size:12px;white-space:nowrap}.chip button{border:0;background:var(--navy);color:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:12px}
.ysel{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:0 10px;height:40px}.ysel select{border:0;padding:0;background:none;font-weight:700;width:auto}
.ib{width:40px;height:40px;flex:0 0 40px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--navy);display:flex;align-items:center;justify-content:center}.ib svg{width:18px;height:18px}
html[data-theme=dark] .ib{color:#fff}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;background:var(--navy);color:#fff;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.btn.t{background:var(--terra)}.btn.soft{background:var(--sand);color:var(--navy);border:1.5px solid var(--sand2)}.btn.ghost{background:none;color:var(--tx2);border:1.5px solid var(--line)}.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:10px}
html[data-theme=dark] .btn{background:#3B4C66}html[data-theme=dark] .btn.t{background:var(--terra)}html[data-theme=dark] .btn.soft{color:#fff}
.btn svg{width:16px;height:16px}
.card{background:var(--paper);border-radius:18px;box-shadow:var(--sh);padding:18px;min-width:0}
.k{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--terra);font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}.k .r{margin-left:auto;text-transform:none;letter-spacing:0;color:var(--tx2);font-weight:600}
.g{display:grid;gap:16px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g32{grid-template-columns:3fr 2fr}
.mut{color:var(--tx2)}.small{font-size:12px}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.p-ok{background:var(--okbg);color:var(--ok)}.p-bad{background:var(--badbg);color:var(--bad)}.p-warn{background:var(--warnbg);color:var(--warn)}.p-info{background:var(--infobg);color:var(--info)}.p-mut{background:var(--sand);color:var(--tx2)}
/* street hero */
.street{background:var(--paper);border-radius:26px;box-shadow:var(--sh);overflow:hidden;margin-bottom:16px}
.street .top2{display:flex;align-items:flex-end;gap:16px;padding:22px 26px 0;flex-wrap:wrap}
.street h2{font-family:var(--serif);font-weight:600;font-size:32px;color:var(--navy);margin:4px 0 4px;line-height:1.1}html[data-theme=dark] .street h2{color:#fff}
.street .bk{font-size:11px;letter-spacing:2px;color:var(--terra);font-weight:700}.street p{margin:0;color:var(--tx2);font-size:14px}
.rentbar{margin-left:auto;min-width:280px}.rentbar .lbl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--tx2);margin-bottom:6px}.rentbar .lbl b{color:var(--tx);font-size:14px}
.bar{height:12px;border-radius:9px;background:var(--sand);overflow:hidden;display:flex}.bar i{display:block;height:100%}
.scene{position:relative;margin-top:6px}.scene svg{width:100%;height:auto}
.scene .hs{cursor:pointer}.scene .hs .bd{transition:transform .25s cubic-bezier(.2,1.4,.4,1);transform-box:fill-box;transform-origin:center bottom}
.scene .hs:hover .bd{transform:translateY(-6px)}
.hint{position:absolute;right:18px;bottom:14px;background:var(--navy);color:#fff;font-size:12px;font-weight:600;border-radius:999px;padding:6px 13px;pointer-events:none}
.kpi{display:flex;gap:13px;align-items:center}.kpi .ki{width:44px;height:44px;flex:0 0 44px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--sand);color:var(--navy)}.kpi .ki svg{width:21px;height:21px}
html[data-theme=dark] .kpi .ki{color:#fff}
.kpi b{display:block;font-family:var(--serif);font-size:25px;color:var(--navy);line-height:1.1}html[data-theme=dark] .kpi b{color:#fff}.kpi span{font-size:12px;color:var(--tx2)}
.kpi.bad .ki{background:var(--badbg);color:var(--bad)}.kpi.ok .ki{background:var(--okbg);color:var(--ok)}
.alert{display:flex;gap:11px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.alert:last-child{border-bottom:0}
.alert .ai{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:flex;align-items:center;justify-content:center}.alert .ai svg{width:17px;height:17px}
.alert .mn{flex:1;min-width:0}.alert .mn b{display:block;font-size:13.5px}.alert .mn span{font-size:12px;color:var(--tx2)}
.chart{width:100%}.chart text{font-size:11px;fill:var(--tx2)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--tx2);flex-wrap:wrap}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* property cards */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.pc{background:var(--paper);border-radius:20px;box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column;border:0;text-align:left;padding:0;transition:transform .2s}.pc:hover{transform:translateY(-3px)}
.pc .art{background:var(--sand);height:150px;display:flex;align-items:flex-end;justify-content:center;position:relative}.pc .art svg{height:136px;width:auto}
.pc .art .pill{position:absolute;top:12px;left:12px}
.pc .bd2{padding:14px 16px 16px}.pc b.nm{font-family:var(--serif);font-size:19px;color:var(--navy);display:block}html[data-theme=dark] .pc b.nm{color:#fff}.pc .ad{font-size:12px;color:var(--tx2)}
.pc .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.pc .nums div{background:var(--cream);border-radius:11px;padding:8px}.pc .nums b{display:block;font-size:14.5px}.pc .nums span{font-size:10.5px;color:var(--tx2)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.detail{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:center;background:var(--paper);border-radius:22px;box-shadow:var(--sh);padding:18px;margin-bottom:16px}
.detail .art{background:var(--sand);border-radius:16px;height:190px;display:flex;align-items:flex-end;justify-content:center}.detail .art svg{height:176px;width:auto}
.detail h2{font-family:var(--serif);font-size:28px;margin:0;color:var(--navy)}html[data-theme=dark] .detail h2{color:#fff}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.metrics div{background:var(--cream);border-radius:12px;padding:10px 12px}.metrics b{display:block;font-family:var(--serif);font-size:20px}.metrics span{font-size:11px;color:var(--tx2)}
/* tables */
.tscroll{overflow-x:auto}.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--terra);padding:8px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}.tbl tr:hover td{background:var(--cream)}.tbl td.num,.tbl th.num{text-align:right;white-space:nowrap}
.tbl tfoot td{font-weight:800;border-top:2px solid var(--line);border-bottom:0}
.acts{display:flex;gap:6px;justify-content:flex-end}.acts button{border:1.5px solid var(--line);background:var(--paper);border-radius:9px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--tx2)}.acts button svg{width:15px;height:15px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.toolbar select{width:auto}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--tx2)}.seg button.on{background:var(--navy);border-color:var(--navy);color:#fff}
/* ledger */
.ledger{border-collapse:separate;border-spacing:4px;width:100%}.ledger th{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--terra);font-weight:700;padding:4px;text-align:center}
.ledger td.tn{min-width:170px;padding:6px 8px;font-size:13px}.ledger td.tn b{display:block}.ledger td.tn span{font-size:11.5px;color:var(--tx2)}
.cell{width:100%;min-width:58px;height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);font-size:11.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;padding:0}
.cell small{font-weight:600;font-size:10px;opacity:.85}
.c-paid{background:var(--okbg);border-color:transparent;color:var(--ok)}.c-late{background:var(--badbg);border-color:transparent;color:var(--bad)}.c-part{background:var(--warnbg);border-color:transparent;color:var(--warn)}.c-due{background:var(--infobg);border-color:transparent;color:var(--info)}.c-na{background:transparent;border-style:dashed;color:var(--tx2);opacity:.5;cursor:default}.c-fut{color:var(--tx2)}
.lsum{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
/* forms/modal */
.fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 14px}.fgrid label{display:flex;flex-direction:column;gap:5px;font-size:11.5px;font-weight:700;color:var(--tx2)}.fgrid label.w{grid-column:1/-1}
#mw{position:fixed;inset:0;background:rgba(15,21,32,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}#mw.on{display:flex}
#mb{background:var(--paper);border-radius:22px;max-width:620px;width:100%;max-height:90vh;overflow:auto;padding:22px;box-shadow:0 30px 80px rgba(15,21,32,.35)}
#mb h3{font-family:var(--serif);color:var(--navy);margin:0 0 4px;font-size:23px}html[data-theme=dark] #mb h3{color:#fff}
.mfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);opacity:0;background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;font-size:13px;z-index:120;transition:all .3s}#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{padding:22px;text-align:center;color:var(--tx2);border:1.5px dashed var(--line);border-radius:14px}
.tcard{display:flex;gap:12px;align-items:center;padding:12px;border:1.5px solid var(--line);border-radius:16px;background:var(--cream)}
.av{width:42px;height:42px;flex:0 0 42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
.mcol{background:var(--sand);border-radius:18px;padding:12px;min-height:120px}.mcol h4{margin:2px 4px 10px;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--tx2);display:flex;justify-content:space-between}
.mc{background:var(--paper);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:var(--sh)}.mc b{display:block;font-size:13.5px}.mc .small{margin-top:3px}.mc .acts{margin-top:8px;justify-content:flex-start}
#scrim{display:none}
@media(max-width:1250px){.chip span{display:none}.g4{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:1fr 1fr}}
@media(max-width:1100px){.g32{grid-template-columns:1fr}.lsum{grid-template-columns:1fr 1fr}.ttl p{display:none}.ttl h1{white-space:normal;font-size:21px}}
@media(max-width:860px){
 #side{position:fixed;left:0;top:0;bottom:0;z-index:90;transform:translateX(-105%);transition:transform .25s}#side.open{transform:none}
 #scrim.on{display:block;position:fixed;inset:0;background:rgba(15,21,32,.45);z-index:80}
 .ib.ham{display:flex}#main{padding:0 14px 30px}.chip,.tb-print,.ysel .yl{display:none!important}.qaT{display:none}
 .g2,.g3,.fgrid,.detail{grid-template-columns:1fr}.street .top2{padding:16px 16px 0}.street h2{font-size:24px}.rentbar{min-width:0;width:100%}
 .hint{display:none}.g4{grid-template-columns:1fr 1fr}.kpi b{font-size:20px}
 .tbl .hm{display:none}
 header.top{gap:6px}.ttl{min-width:0}.ttl h1{font-size:18px!important}.ib{width:36px;height:36px;flex-basis:36px}.ysel{height:36px;padding:0 6px}.btn.t.no-print{padding:8px 11px}#thB{display:none}
}
@media print{#side,header.top,.no-print,#toast,#scrim,#mw,.toolbar .btn{display:none!important}#main{padding:0}body{background:#fff}.card,.street,.pc,.detail{box-shadow:none;border:1px solid #ddd;break-inside:avoid}.wrap{max-width:none}}
html[data-theme=dark] .pc .art,html[data-theme=dark] .detail .art{background:#D9CDBB}
.ngrp{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:#AEB8C7;opacity:.8;margin:14px 10px 4px}
#nav .nv{padding:8px 10px;margin:1px 0}
.tav{display:flex;align-items:center;gap:5px;margin-top:8px;flex-wrap:wrap}.tav span{width:26px;height:26px;border-radius:50%;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--paper)}.tav em{font-style:normal;font-size:12px;color:var(--tx2);margin-left:auto}
.qtiles{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}
.qtiles button{border:0;background:var(--paper);box-shadow:var(--sh);border-radius:16px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:13px;color:var(--tx);transition:transform .2s}
.qtiles button:hover{transform:translateY(-3px)}.qtiles span{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff}.qtiles span svg{width:21px;height:21px}
.ktile{border-radius:18px;padding:16px 18px;color:#fff;box-shadow:var(--sh)}.ktile span{font-size:12px;opacity:.85;display:block}.ktile b{display:block;font-family:var(--serif);font-size:28px;margin:4px 0 2px}.ktile em{font-style:normal;font-size:12px;opacity:.85}
.lb{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}.lb>b{width:22px;height:22px;border-radius:50%;background:var(--sand);display:flex;align-items:center;justify-content:center;font-size:11px}.lb .sw{width:10px;height:28px;border-radius:4px}.lb .mn{flex:1;min-width:0;font-weight:700;font-size:13px}.lb small{display:block;font-weight:500;color:var(--tx2);font-size:11.5px}.lb strong{font-size:13.5px}
.tl{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.tl .dd{width:46px;flex:0 0 46px;text-align:center;background:var(--sand);border-radius:11px;padding:5px 0}.tl .dd b{display:block;font-size:17px;line-height:1}.tl .dd span{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--tx2)}.tl>i{width:4px;height:34px;border-radius:3px}.tl .mn{flex:1;min-width:0}.tl .mn b{display:block;font-size:13.5px}.tl .mn span{font-size:12px;color:var(--tx2)}
.rule{display:flex;gap:11px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.rule>span{width:28px;height:28px;flex:0 0 28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800}.rule b{display:block;font-size:13.5px}.rule small{color:var(--tx2);font-size:12px}
.verdict .metrics div{background:var(--cream)}
.rrow{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:10px;border-radius:12px;border-bottom:1px solid var(--line)}.rrow.on{background:var(--sand)}.rrow .mn{flex:1}.rrow .mn b{display:block;font-size:13.5px}.rrow .mn span{font-size:12px;color:var(--tx2)}
.receipt{background:#fff;color:#1B2433;border-radius:16px;box-shadow:var(--sh);padding:28px;border-top:8px solid #C9694B}
.receipt .rhead{display:flex;justify-content:space-between;gap:16px;margin-bottom:16px}.receipt h2{font-family:var(--serif);margin:4px 0 0;font-size:26px;color:#1F2B3D}.receipt .bk{font-size:11px;letter-spacing:2.4px;color:#C9694B;font-weight:800}
.receipt .rno{text-align:right;font-weight:800;font-size:18px;color:#1F2B3D}.receipt .rno span{display:block;font-size:12px;font-weight:500;color:#5F6878}
.receipt .tbl td{color:#1B2433;border-color:#E7DFD3}.receipt .tbl th{color:#C9694B}.receipt .tbl tr:hover td{background:none}.receipt .rtot td{font-weight:800;font-size:16px;border-top:2px solid #1F2B3D}
.sign{display:flex;gap:30px;margin-top:40px}.sign div{flex:1;font-size:12px;color:#5F6878}.sign span{display:block;border-bottom:1.5px solid #1F2B3D;height:28px;margin-bottom:6px}
.irow{display:grid;grid-template-columns:150px auto 1fr;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}.irow b{font-size:13px}
.cseg{display:flex;gap:4px}.cseg label{cursor:pointer}.cseg input{display:none}.cseg span{display:block;font-size:11.5px;font-weight:700;padding:5px 9px;border-radius:999px;border:1.5px solid var(--line);color:var(--tx2)}
.cseg label:nth-child(1) input:checked+span{background:var(--okbg);color:var(--ok);border-color:var(--ok)}.cseg label:nth-child(2) input:checked+span{background:var(--warnbg);color:var(--warn);border-color:var(--warn)}.cseg label:nth-child(3) input:checked+span{background:var(--badbg);color:var(--bad);border-color:var(--bad)}
.chk{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}.chk input{width:18px;height:18px;accent-color:#C9694B}
#printArea{display:none}
@media(max-width:1250px){.qtiles{grid-template-columns:repeat(3,1fr)}#dealg{grid-template-columns:1fr!important}}
@media(max-width:860px){.qtiles{grid-template-columns:repeat(3,1fr);gap:8px}.qtiles button{font-size:11.5px;padding:10px 6px}.ktile b{font-size:21px}.irow{grid-template-columns:1fr}.rhead{flex-direction:column}.receipt .rno{text-align:left}
 #view>.g[style*="grid-template-columns:1fr 1.2fr"]{grid-template-columns:1fr!important}}
@media print{body.print-receipt #view>.g>.card,body.print-receipt .street{display:none!important}body.print-receipt #view>.g{display:block!important}
 body.print-area .app{display:none!important}body.print-area #printArea{display:block!important}.receipt{box-shadow:none}}
:root{--pri:#1F2B3D;--pri2:#E9EEF5}
html[data-theme=dark]{--pri:#3A4F70;--pri2:#243045}
.btn.t,html[data-theme=dark] .btn.t{background:var(--pri)!important;color:#fff}
.btn.soft{background:var(--pri2)!important;color:var(--tx)!important;border-color:transparent!important}
.nv.on{background:#E9EEF5!important;color:#1F2B3D!important}.nv.on .ic{color:#1F2B3D}
.k{color:var(--tx)!important;opacity:.75}.tbl th,.receipt .tbl th{color:var(--tx2)!important}.how .hx{position:absolute;top:6px;right:8px}.how{padding-right:34px}
input:focus,select:focus,textarea:focus{border-color:var(--pri)}
.phero{background:#1F2B3D;color:#fff;border-radius:20px;padding:20px 22px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px;box-shadow:var(--sh)}
html[data-theme=dark] .phero{background:#0F1520;border:1px solid var(--line)}
.ph1{display:flex;gap:14px;align-items:center;min-width:240px;flex:1}
.phic{width:52px;height:52px;flex:0 0 52px;border-radius:16px;background:#E9EEF5;color:#1F2B3D;display:flex;align-items:center;justify-content:center}.phic svg{width:25px;height:25px}
.ph1 b{font-family:var(--serif);font-size:22px}.ph1 p.phd{font-family:var(--serif);font-size:19px;color:#fff;line-height:1.3}.ph1 p{margin:3px 0 0;font-size:13px;color:#C4CCD8;max-width:420px}
.phs{display:grid;grid-template-columns:repeat(4,minmax(110px,1fr));gap:10px}
.phs div{background:#2A3850;border-radius:14px;padding:10px 14px}.phs b{display:block;font-size:18px;font-family:var(--serif);white-space:nowrap}.phs span{font-size:11.5px;color:#B5BFCD}
.how{display:flex;align-items:center;gap:10px;background:var(--pri2);border-radius:14px;padding:10px 14px;margin-bottom:16px;position:relative;flex-wrap:wrap}
.how .hl{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;font-weight:800;color:var(--tx2);margin-right:4px}
.how .st{display:flex;gap:8px;align-items:center;font-size:13px;flex:1;min-width:190px}.how .st i{font-style:normal;width:22px;height:22px;flex:0 0 22px;border-radius:50%;background:var(--pri);color:#fff;font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
.how .hx{border:0;background:none;color:var(--tx2);font-size:13px;padding:4px 6px}
.howbtn{border:0;background:var(--pri2);color:var(--tx2);font-size:12px;font-weight:700;border-radius:999px;padding:6px 12px;margin-bottom:14px}
@media(max-width:860px){.phs{grid-template-columns:repeat(2,1fr);width:100%}.phero{padding:16px}.how .st{min-width:100%}}
@media(max-width:860px){.card:has(>.tbl),.tscroll{overflow-x:auto}.card>.tbl,.tscroll>.tbl{min-width:620px}.card>.tbl td,.tscroll>.tbl td{white-space:nowrap}}
@media print{.toolbar,.phero,.how,.howbtn{display:none!important}}

.k,.tbl th,.ngrp,.mcol h4,.how .hl{text-transform:none!important;letter-spacing:0!important}
.k{font-size:14px!important;font-weight:700!important;opacity:1!important;color:var(--tx)!important}
.tbl th{font-size:12px!important;font-weight:700!important}
.ngrp{font-size:12px!important;font-weight:600;color:#8D99AB!important}
.mcol h4{font-size:14px!important}

#dBar b{font-size:12.5px}.dTrack{width:120px;height:7px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden}.dTrack i{display:block;height:100%;width:0;background:#E9EEF5;transition:width .3s}
#dBar a{background:#E9EEF5;color:#1F2B3D;font-weight:700;border-radius:999px;padding:6px 14px;text-decoration:none}
#side{top:44px!important;height:calc(100vh - 44px)!important}header.top{top:44px!important}
#dWall{display:none;position:fixed;inset:0;z-index:300;background:rgba(31,43,61,.6);align-items:center;justify-content:center;padding:16px}#dWall.on{display:flex}
.dBox{background:#fff;border-radius:22px;max-width:460px;padding:28px;color:#1F2B3D;box-shadow:0 20px 60px rgba(31,43,61,.4)}
.dK{font-size:13px;color:#6B7586;font-weight:700}.dBox h3{font-family:var(--serif);color:#1F2B3D;font-size:23px;margin:8px 0 10px}.dBox p{font-size:14px;line-height:1.6;margin:0 0 18px;color:#556071}
.dBtns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}.dBtns button,.dBtns a{border-radius:12px;padding:10px 16px;font-weight:700;font-size:14px;text-decoration:none;cursor:pointer}.dBtns button{background:#E9EEF5;color:#1F2B3D;border:0}.dBtns a{background:#1F2B3D;color:#fff}
@media(max-width:860px){#side{top:0!important;height:100vh!important}#dBar .dt{display:none}.dTrack{width:70px}#dBar{font-size:11.5px;gap:8px}}
@media print{#dBar,#dWall{display:none!important}}

function cellState(t,y,m){if(!inLease(t,y,m))return{st:'na'};const e=S.ledger[t.id+'|'+ymk(y,m)];const rent=+t.rent||0;const paid=e?(+e.paid||0):0;
 const dueDate=new Date(y,m,Math.min(+t.due||1,28));const grace=new Date(dueDate);grace.setDate(grace.getDate()+(+t.grace||0));const td=today();

 return{inc,opx,noi,debt,capex,cashflow,cap:(+p.value||+p.price)?annNoi/(+p.value||+p.price):NaN,coc:+p.cash?annCf/(+p.cash):NaN,equity:(+p.value||0)-(+p.loan||0),units,occ}}
